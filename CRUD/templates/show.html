
<!DOCTYPE html>
<html>
<head>
    <title>Student Records</title>
</head>
<body>
    <h1>Student Records</h1>

    <table border="1" cellpadding="10">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>City</th>
	    <th colspan="2">Action</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student.id }}</td>
            <td>{{ student.name }}</td>
            <td>{{ student.email }}</td>
            <td>{{ student.city }}</td>
	    <td>
                <a href="{% url 'edit' %}?id={{ student.id }}">Edit</a>
            </td>
	    <td>
                <a href="{% url 'delete' %}?id={{ student.id }}">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">No records found.</td>
        </tr>
        {% endfor %}
    </table>

    <p><a href="{% url 'insert' %}">Add Another Student</a></p>
</body>
</html>
